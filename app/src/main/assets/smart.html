<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Smart 运行状态</title>
<style>
  :root {
    --bg: #0b0f14; --card: #141a22; --card2: #1b232e; --line: #232d3b;
    --fg: #e9eef5; --dim: #8695a7; --acc: #4da3ff; --acc2: #7c6bff;
    --good: #3ecf8e; --warn: #f5b544;
    --sa-t: env(safe-area-inset-top, 0px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { background: var(--bg); }
  body {
    color: var(--fg);
    font: 14px/1.5 -apple-system, "PingFang SC", "Noto Sans SC", sans-serif;
    padding: calc(var(--sa-t) + 14px) 14px 30px;
    max-width: 560px; margin: 0 auto;
  }
  .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  h1 { font-size: 19px; font-weight: 700; letter-spacing: .3px; }
  .chips { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
  .chip {
    font-size: 11px; color: var(--dim); background: var(--card);
    border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px;
    max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .iconbtn {
    width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--card); color: var(--dim); font-size: 15px; cursor: pointer;
  }
  .iconbtn.spin { animation: r 1s linear infinite; color: var(--acc); }
  @keyframes r { to { transform: rotate(360deg); } }
  .tabs {
    display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 12px;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: 0 0 auto; padding: 7px 14px; border-radius: 999px; font-size: 13px;
    border: 1px solid var(--line); background: var(--card); color: var(--dim); cursor: pointer;
  }
  .tab.on {
    background: linear-gradient(135deg, var(--acc), var(--acc2));
    border-color: transparent; color: #fff; font-weight: 600;
  }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 16px; margin-bottom: 12px;
  }
  .banner {
    border: 1px solid var(--line); border-radius: 14px; padding: 16px;
    background: var(--card); margin-bottom: 12px; font-size: 13px; color: var(--dim); line-height: 1.8;
  }
  .banner b { color: var(--warn); }
  .hero { display: flex; align-items: center; gap: 16px; }
  .ring { position: relative; width: 108px; height: 108px; flex: 0 0 auto; }
  .ring svg { transform: rotate(-90deg); }
  .ring .track { stroke: var(--card2); }
  .ring .fill { stroke: url(#grad); stroke-linecap: round; transition: stroke-dashoffset .8s ease; }
  .ring .center {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; padding: 0 8px;
  }
  .ring .center .pct { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .ring .center .lbl { font-size: 10px; color: var(--dim); margin-top: -2px; }
  .hero-r { min-width: 0; flex: 1; }
  .hero-r .cap { font-size: 12px; color: var(--dim); }
  .hero-r .now {
    font-size: 17px; font-weight: 700; margin: 2px 0 4px; word-break: break-all;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .stat-row { display: flex; gap: 10px; margin-top: 10px; }
  .stat { text-align: center; flex: 1; background: var(--card2); border-radius: 10px; padding: 6px 2px; }
  .stat .n { font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat .t { font-size: 10px; color: var(--dim); }
  .podium { display: flex; gap: 8px; margin-bottom: 12px; }
  .podium .p {
    flex: 1; min-width: 0; background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 10px 8px; text-align: center; position: relative; overflow: hidden;
  }
  .podium .p:first-child { border-color: rgba(62,207,142,.45); }
  .podium .medal { font-size: 17px; }
  .podium .nm {
    font-size: 12px; font-weight: 600; margin: 3px 0 2px; word-break: break-all;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .podium .w { font-size: 15px; font-weight: 700; color: var(--good); font-variant-numeric: tabular-nums; }
  .podium .ub { height: 3px; border-radius: 2px; background: var(--card2); margin-top: 7px; overflow: hidden; }
  .podium .ub i { display: block; height: 100%; border-radius: 2px; background: linear-gradient(90deg, var(--good), #8ce8c1); }
  .seclabel { display: flex; justify-content: space-between; align-items: center; margin: 2px 2px 8px; }
  .seclabel .l { font-size: 13px; font-weight: 600; }
  .seclabel .r { font-size: 11px; color: var(--dim); }
  .row { margin: 9px 0; }
  .row .top { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; margin-bottom: 4px; }
  .row .name { min-width: 0; word-break: break-all; display: flex; align-items: baseline; gap: 6px; }
  .row .idx { color: var(--dim); font-variant-numeric: tabular-nums; flex: 0 0 auto; }
  .row .val { flex: 0 0 auto; color: var(--dim); font-variant-numeric: tabular-nums; }
  .rank { font-weight: 600; margin-right: 6px; font-size: 11px; }
  .rank.most { color: var(--good); }
  .rank.occ { color: var(--acc); }
  .rank.rare { color: var(--dim); }
  .bar-wrap { height: 5px; background: var(--card2); border-radius: 3px; overflow: hidden; }
  .bar { height: 100%; border-radius: 3px; background: linear-gradient(90deg, var(--acc), #7cc4ff); }
  .bar.now { background: linear-gradient(90deg, var(--good), #8ce8c1); }
  .now-tag {
    display: inline-block; padding: 0 6px; border-radius: 4px; font-size: 10px;
    background: rgba(62,207,142,.15); color: var(--good);
  }
  .more {
    width: 100%; margin-top: 10px; padding: 9px; border-radius: 10px; cursor: pointer;
    border: 1px dashed var(--line); background: transparent; color: var(--dim); font-size: 12px;
  }
  details.unused { margin-top: 12px; }
  details.unused summary { color: var(--dim); font-size: 12px; cursor: pointer; }
  .unused-list {
    margin-top: 8px; color: var(--dim); font-size: 12px; line-height: 1.9;
    max-height: 160px; overflow-y: auto; word-break: break-all;
  }
  .foot { color: #5c6a7a; font-size: 11px; margin-top: 20px; line-height: 1.8; }
  .spin {
    display: inline-block; width: 12px; height: 12px; border: 2px solid var(--line);
    border-top-color: var(--acc); border-radius: 50%; animation: r 1s linear infinite; vertical-align: -2px;
  }
</style>
</head>
<body>
<div class="topbar">
  <h1>Smart 运行状态</h1>
  <button class="iconbtn" id="refresh" onclick="tick(true)">⟳</button>
</div>
<div class="chips">
  <span class="chip" id="chip-core">连接中…</span>
  <span class="chip" id="chip-mode"></span>
  <span class="chip" id="chip-sync"></span>
</div>
<div id="content"><div class="banner"><span class="spin"></span> 正在连接本地内核…</div></div>
<div class="foot">
  排行只收录内核实际选用的节点,smart 学会最优解后会集中使用——少数节点有分是正常现象。<br>
  数据存在本机(按订阅隔离),每 15 秒自动刷新;排行由内核每 5 分钟统计一次。
</div>
<script>
"use strict";
const BASE = "http://127.0.0.1:9090";
const RANK_CN = { MostUsed: "最常用", OccasionalUsed: "偶尔使用", RarelyUsed: "很少使用" };
const MSG_CN = {
  "No weight data available for the specified group": "内核还没为这个组积累出排行",
  "Not a Smart group": "该组不是 Smart 组",
  "Smart cache not available": "内核缓存不可用"
};
const SHOW_DEFAULT = 6;
let groups = [], current = null, expanded = false, syncing = false;

const $ = id => document.getElementById(id);
const esc = s => (s + "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rankCN = s => RANK_CN[s] || (s || "");
const rankCls = s => s === "MostUsed" ? "most" : (s === "OccasionalUsed" ? "occ" : "rare");

async function jget(p) {
  const r = await fetch(BASE + p, { cache: "no-store" });
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}
function banner(html) { $("content").innerHTML = '<div class="banner">' + html + "</div>"; }

async function loadMeta() {
  try {
    const v = await jget("/version");
    const mode = await jget("/configs").then(c => c.mode).catch(() => "?");
    const m = { rule: "规则分流", global: "全局", direct: "直连" };
    $("chip-core").textContent = "内核 " + (v.meta ? v.meta.split("-")[0] + " · " : "") + (v.version || "");
    $("chip-mode").textContent = "模式 " + (m[mode] || mode);
  } catch (e) { $("chip-core").textContent = "未连接"; }
}

async function loadGroups() {
  const d = await jget("/group");
  groups = (d.proxies || []).filter(g => (g.type || "").toLowerCase() === "smart");
  if (!groups.some(g => g.name === current)) current = groups.length ? groups[0].name : null;
}

function renderTabs() {
  const el = $("tabs");
  if (!el) return;
  el.innerHTML = groups.map((g, i) =>
    '<div class="tab' + (g.name === current ? " on" : "") + '" data-i="' + i + '">' + esc(g.name) + "</div>").join("");
}

document.addEventListener("click", e => {
  const t = e.target.closest(".tab");
  if (t) { current = groups[+t.dataset.i].name; expanded = false; renderTabs(); loadWeights(); return; }
  if (e.target.closest("#more")) { expanded = true; loadWeights(); }
});

async function loadWeights() {
  const box = $("panel");
  if (!box) return;
  if (!current) {
    box.innerHTML = '<div class="banner">当前配置里没有 Smart 组。<br>导入标准订阅后,App 会自动把 url-test / fallback / load-balance 组转换成 smart;启动 VPN 并正常上网后,这里就会出现权重数据。</div>';
    return;
  }
  try {
    const enc = encodeURIComponent(current);
    const g = await jget("/group/" + enc);
    const allNodes = g.all || [];
    let d = {};
    try { d = await jget("/group/" + enc + "/weights"); } catch (e2) { d = { weights: [] }; }
    const ranked = (d.weights || d.result || []).slice().sort((a, b) => (b.Weight || 0) - (a.Weight || 0));
    const rankedNames = new Set(ranked.map(i => i.Name));
    const unused = allNodes.filter(n => !rankedNames.has(n));
    const upd = d.last_updated ? new Date(d.last_updated * 1000) : null;

    const topItem = ranked[0] || null;
    const pct = topItem ? Math.max(0, Math.min(100, topItem.Weight || 0)) : 0;
    const R = 46, C = (2 * Math.PI * R).toFixed(1);
    const dash = (C * pct / 100).toFixed(1);
    let html =
      '<div class="card"><div class="hero">'
      + '<div class="ring"><svg width="108" height="108" viewBox="0 0 108 108">'
      + '<defs><linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">'
      + '<stop offset="0" stop-color="#4da3ff"/><stop offset="1" stop-color="#7c6bff"/></linearGradient></defs>'
      + '<circle class="track" cx="54" cy="54" r="' + R + '" fill="none" stroke-width="9"/>'
      + '<circle class="fill" cx="54" cy="54" r="' + R + '" fill="none" stroke-width="9" '
      + 'stroke-dasharray="' + C + '" stroke-dashoffset="' + (C - dash) + '"/></svg>'
      + '<div class="center"><div class="pct">' + (ranked.length ? Math.round(pct) + "分" : "—") + '</div><div class="lbl">组内最高权重</div></div></div>'
      + '<div class="hero-r"><div class="cap">组内最优节点</div><div class="now">'
      + (topItem ? esc(topItem.Name) : '<span style="color:var(--dim)">统计生成中</span>') + "</div>"
      + '<div class="cap" style="margin-top:-2px">按域名/目标自动择优,多个节点可同时使用</div>'
      + '<div class="stat-row">'
      + '<div class="stat"><div class="n">' + allNodes.length + '</div><div class="t">组内节点</div></div>'
      + '<div class="stat"><div class="n">' + ranked.length + '</div><div class="t">有排行数据</div></div>'
      + '<div class="stat"><div class="n">' + (upd ? upd.getHours().toString().padStart(2, "0") + ":" + upd.getMinutes().toString().padStart(2, "0") : "—") + '</div><div class="t">排行更新</div></div>'
      + "</div></div></div></div>";

    if (!ranked.length) {
      html += '<div class="banner">' + esc(d.message ? (MSG_CN[d.message] || "内核提示:" + d.message) : "暂无权重数据")
        + "<br>启动 VPN、正常上网几分钟后,内核每 5 分钟会统计一次排行。</div>";
    } else {
      const top = ranked.slice(0, Math.min(3, ranked.length));
      const medals = ["🥇", "🥈", "🥉"];
      html += '<div class="podium">' + top.map((it, i) => {
        const w = Math.max(0, Math.min(100, it.Weight || 0));
        return '<div class="p"><div class="medal">' + medals[i] + "</div>"
          + '<div class="nm">' + esc(it.Name) + "</div>"
          + '<div class="w">' + Math.round(w) + "</div>"
          + '<div class="ub"><i style="width:' + Math.max(4, w) + '%"></i></div></div>';
      }).join("") + "</div>";

      const rest = ranked.slice(3);
      const visible = expanded ? rest : rest.slice(0, SHOW_DEFAULT);
      html += '<div class="seclabel"><span class="l">完整排行</span><span class="r">共 ' + ranked.length + " 个</span></div>";
      html += '<div class="card">';
      ranked.slice(0, 3).forEach((it, i) => { html += rowHTML(it, i); });
      visible.forEach((it, i) => { html += rowHTML(it, i + 3); });
      if (rest.length > SHOW_DEFAULT && !expanded)
        html += '<button class="more" id="more">展开其余 ' + (rest.length - SHOW_DEFAULT) + " 个节点</button>";
      if (unused.length)
        html += '<details class="unused"><summary>未进入排行的节点(' + unused.length
          + "个)— 内核近期未选用,属正常</summary><div class=\"unused-list\">"
          + unused.map(esc).join("<br>") + "</div></details>";
      html += "</div>";
    }
    box.innerHTML = html;
  } catch (e) {
    box.innerHTML = '<div class="banner"><b>读取失败:</b> ' + esc(e.message) + "<br>请确认 VPN 已启动(内核运行中),稍后自动重试。</div>";
  }
}

function rowHTML(it, i) {
  const w = Math.max(0, Math.min(100, it.Weight || 0));
  return '<div class="row"><div class="top"><span class="name"><span class="idx">' + (i + 1) + ".</span>"
    + "<span>" + esc(it.Name) + "</span>"
    + '<span class="val"><span class="rank ' + rankCls(it.Rank) + '">' + esc(rankCN(it.Rank))
    + "</span>" + Math.round(w) + '</span></div><div class="bar-wrap"><div class="bar'
    + '" style="width:' + Math.max(2, w) + '%"></div></div></div>';
}

async function tick(manual) {
  if (syncing) return;
  syncing = true;
  const btn = $("refresh");
  if (btn) btn.classList.add("spin");
  try {
    await loadGroups();
    if (!$("tabs")) {
      $("content").innerHTML = '<nav class="tabs" id="tabs"></nav><div id="panel"></div>';
    }
    renderTabs();
    await loadWeights();
    $("chip-sync").textContent = "已同步 " + new Date().toLocaleTimeString("zh-CN", { hour12: false });
  } catch (e) {
    banner("<b>无法连接本地内核 (127.0.0.1:9090)。</b><br>请先在主界面启动 VPN;内核运行后本页会自动恢复。");
  }
  syncing = false;
  if (btn) setTimeout(() => btn.classList.remove("spin"), 600);
}

loadMeta();
tick();
setInterval(tick, 15000);
</script>
</body>
</html>
