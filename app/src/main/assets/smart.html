<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Smart 运行状态</title>
<style>
  :root {
    --bg: #0e1116; --card: #171c24; --card2: #1d242f; --line: #2a3342;
    --fg: #e8edf4; --dim: #8b96a5; --acc: #4da3ff; --good: #3ecf8e; --warn: #f5b544;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font: 14px/1.5 -apple-system, "PingFang SC", "Noto Sans SC", sans-serif;
    padding: 16px 14px 40px;
  }
  h1 { font-size: 18px; margin-bottom: 4px; }
  .sub { color: var(--dim); font-size: 12px; margin-bottom: 14px; word-break: break-all; }
  .banner {
    border: 1px solid var(--line); border-radius: 10px; padding: 14px;
    background: var(--card); margin-bottom: 14px; font-size: 13px; color: var(--dim);
  }
  .banner b { color: var(--warn); }
  .tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .tab {
    padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line);
    background: var(--card); color: var(--dim); font-size: 13px; cursor: pointer; user-select: none;
  }
  .tab.on { background: var(--acc); border-color: var(--acc); color: #fff; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px 14px; margin-bottom: 12px;
  }
  .card h2 { font-size: 14px; margin-bottom: 2px; }
  .meta { color: var(--dim); font-size: 11px; margin-bottom: 10px; }
  .row { margin: 8px 0; }
  .row .top { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 3px; }
  .row .name { color: var(--fg); word-break: break-all; }
  .row .val { color: var(--dim); font-variant-numeric: tabular-nums; }
  .row .val .rank { color: var(--good); font-weight: 600; margin-right: 6px; }
  .bar-wrap { height: 6px; background: var(--card2); border-radius: 3px; overflow: hidden; }
  .bar { height: 100%; border-radius: 3px; background: linear-gradient(90deg, var(--acc), #7cc4ff); }
  .bar.now { background: linear-gradient(90deg, var(--good), #8ce8c1); }
  .now-tag {
    display: inline-block; margin-left: 6px; padding: 0 6px; border-radius: 4px;
    font-size: 10px; background: rgba(62,207,142,.15); color: var(--good);
  }
  .foot { color: var(--dim); font-size: 11px; margin-top: 18px; line-height: 1.7; }
  .spin {
    display: inline-block; width: 12px; height: 12px; border: 2px solid var(--line);
    border-top-color: var(--acc); border-radius: 50%; animation: r 1s linear infinite; vertical-align: -2px;
  }
  @keyframes r { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<h1>Smart 运行状态</h1>
<div class="sub" id="core">连接中…</div>
<div id="content"><div class="banner"><span class="spin"></span> 正在连接本地内核…</div></div>
<div class="foot">
  数据来自本机内核(127.0.0.1:9090),每 15 秒自动刷新。<br>
  权重排行由内核每 5 分钟统计一次;学习期(前几天)排名波动属正常现象。<br>
  若提示无法连接:请先在主界面启动 VPN,并确认正在使用代理(内核需处于运行状态)。
</div>
<script>
const BASE = "http://127.0.0.1:9090";
let groups = [], current = null, timer = null;

async function jget(path) {
  const r = await fetch(BASE + path, {cache: "no-store"});
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}

function esc(s) { return (s + "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

function banner(html) {
  document.getElementById("content").innerHTML = '<div class="banner">' + html + "</div>";
}

async function loadMeta() {
  try {
    const v = await jget("/version");
    const mode = await jget("/configs").then(c => c.mode).catch(() => "?");
    document.getElementById("core").textContent =
      "内核 " + (v.meta ? v.meta + " · " : "") + (v.version || "") + " · 模式 " + mode;
  } catch (e) {
    document.getElementById("core").textContent = "未连接";
  }
}

async function loadGroups() {
  const d = await jget("/group");
  const all = (d.proxies || []);
  groups = all.filter(g => (g.type || "").toLowerCase() === "smart");
  if (current == null || !groups.some(g => g.name === current))
    current = groups.length ? groups[0].name : null;
  renderTabs();
}

function renderTabs() {
  const tabs = groups.map(g =>
    '<div class="tab' + (g.name === current ? " on" : "") + '" onclick="pick(' + JSON.stringify(g.name).replace(/"/g, "&quot;") + ')">'
    + esc(g.name) + "</div>").join("");
  document.getElementById("tabs") &&
    (document.getElementById("tabs").innerHTML = tabs);
}

window.pick = function(name) { current = name; renderTabs(); loadWeights(); };

async function loadWeights() {
  const box = document.getElementById("panel");
  if (!current) {
    box.innerHTML = '<div class="banner">当前配置里没有 Smart 组。<br>导入标准订阅后,App 会自动把 url-test / fallback / load-balance 组转换成 smart;启动 VPN 并打开几个网页后,这里就会出现权重数据。</div>';
    return;
  }
  box.innerHTML = '<div class="banner"><span class="spin"></span> 加载中…</div>';
  try {
    const d = await jget("/group/" + encodeURIComponent(current) + "/weights");
    // kernel returns {"weights":[{Name,Rank,Weight}...]} (message when empty)
    const list = (d.weights || d.result || []);
    const max = Math.max(1e-6, ...list.map(i => Math.abs(i.Weight || 0)));
    const upd = d.last_updated ? new Date(d.last_updated * 1000).toLocaleString() : null;
    const now = (await jget("/group/" + encodeURIComponent(current)).then(g => g.now).catch(() => ""));
    let html = '<div class="card"><h2>' + esc(current)
      + (now ? '<span class="now-tag">当前 ' + esc(now) + "</span>" : "")
      + '</h2><div class="meta">' + (upd ? "排行更新于 " + esc(upd) + " · " : "") + "共 " + list.length + " 个节点</div>";
    if (!list.length) {
      html += '<div class="meta">' + esc(d.message || "暂无数据")
        + '<br>内核每 5 分钟统计一次排行:启动 VPN、让流量走一会儿(打开几个网页),再回来看就有数据了。</div>';
    }
    for (const it of list) {
      const w = Math.abs(it.Weight || 0);
      const pct = Math.max(2, Math.round(w / max * 100));
      const isNow = it.Name === now;
      html += '<div class="row"><div class="top"><span class="name">' + esc(it.Name)
        + (isNow ? '<span class="now-tag">当前使用</span>' : "")
        + '</span><span class="val"><span class="rank">' + esc(it.Rank || "")
        + "</span>" + (w || 0).toFixed(4) + '</span></div><div class="bar-wrap"><div class="bar'
        + (isNow ? " now" : "") + '" style="width:' + pct + '%"></div></div></div>';
    }
    box.innerHTML = html + "</div>";
  } catch (e) {
    box.innerHTML = '<div class="banner"><b>读取失败:</b> ' + esc(e.message)
      + "<br>请确认 VPN 已启动(内核运行中),稍后自动重试。</div>";
  }
}

async function tick() {
  try {
    await loadGroups();
    if (!document.getElementById("tabs")) {
      document.getElementById("content").innerHTML = '<div class="tabs" id="tabs"></div><div id="panel"></div>';
    }
    renderTabs();
    await loadWeights();
  } catch (e) {
    banner("<b>无法连接本地内核 (127.0.0.1:9090)。</b><br>请先在主界面启动 VPN;内核运行后本页会自动恢复。");
  }
}

loadMeta();
tick();
timer = setInterval(tick, 15000);
</script>
</body>
</html>
