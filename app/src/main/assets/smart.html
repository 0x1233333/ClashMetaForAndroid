<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Smart 运行状态</title>
<style>
  :root {
    --bg: #0b0f14; --card: #141a22; --card2: #1b232e; --line: #232d3b;
    --fg: #e9eef5; --dim: #8695a7; --acc: #4da3ff; --acc2: #7c6bff;
    --good: #3ecf8e; --warn: #f5b544;
    --sa-t: env(safe-area-inset-top, 0px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { background: var(--bg); }
  body {
    color: var(--fg);
    font: 14px/1.5 -apple-system, "PingFang SC", "Noto Sans SC", sans-serif;
    padding: calc(var(--sa-t) + 14px) 14px 30px;
    max-width: 560px; margin: 0 auto;
  }
  .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  h1 { font-size: 19px; font-weight: 700; letter-spacing: .3px; }
  .chips { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; }
  .chip {
    font-size: 11px; color: var(--dim); background: var(--card);
    border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px;
    max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .iconbtn {
    width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--card); color: var(--dim); font-size: 15px; cursor: pointer;
  }
  .iconbtn.spin { animation: r 1s linear infinite; color: var(--acc); }
  @keyframes r { to { transform: rotate(360deg); } }
  .tabs {
    display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 12px;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: 0 0 auto; padding: 7px 14px; border-radius: 999px; font-size: 13px;
    border: 1px solid var(--line); background: var(--card); color: var(--dim); cursor: pointer;
  }
  .tab.on {
    background: linear-gradient(135deg, var(--acc), var(--acc2));
    border-color: transparent; color: #fff; font-weight: 600;
  }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 16px; margin-bottom: 12px;
  }
  .banner {
    border: 1px solid var(--line); border-radius: 14px; padding: 16px;
    background: var(--card); margin-bottom: 12px; font-size: 13px; color: var(--dim); line-height: 1.8;
  }
  .banner b { color: var(--warn); }
  .stat-row { display: flex; gap: 10px; }
  .stat { text-align: center; flex: 1; background: var(--card2); border-radius: 10px; padding: 8px 2px; }
  .stat .n { font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .stat .t { font-size: 10px; color: var(--dim); }
  .seclabel { display: flex; justify-content: space-between; align-items: center; margin: 2px 2px 8px; }
  .seclabel .l { font-size: 13px; font-weight: 600; }
  .live-dot {
    display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: var(--good); margin-right: 5px; vertical-align: 1px;
    animation: pulse 2s ease infinite;
  }
  @keyframes pulse { 50% { opacity: .35; } }
  .seclabel .r { font-size: 11px; color: var(--dim); }
  .lrow { margin: 10px 0; }
  .lrow .top { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; margin-bottom: 3px; }
  .lrow .name { min-width: 0; word-break: break-all; font-weight: 600; display: flex; align-items: baseline; gap: 6px; }
  .lrow .idx { color: var(--dim); font-weight: 400; font-size: 11px; }
  .lrow .val { flex: 0 0 auto; color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums; }
  .lrow .val b { color: var(--fg); font-weight: 600; }
  .lrow .sub {
    font-size: 11px; color: var(--dim); margin: 2px 0 4px; word-break: break-all;
    display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden;
  }
  .bar-wrap { height: 5px; background: var(--card2); border-radius: 3px; overflow: hidden; }
  .bar { height: 100%; border-radius: 3px; background: linear-gradient(90deg, var(--good), #8ce8c1); transition: width .5s ease; }
  .rank { font-weight: 600; margin-right: 6px; font-size: 11px; }
  .rank.most { color: var(--good); }
  .rank.occ { color: var(--acc); }
  .rank.rare { color: var(--dim); }
  details.ranking, details.unused { margin-top: 10px; }
  details summary { color: var(--dim); font-size: 12px; cursor: pointer; }
  .unused-list, .rank-body { margin-top: 10px; word-break: break-all; }
  .rank-body { background: var(--card2); border-radius: 12px; padding: 12px; }
  .unused-list {
    color: var(--dim); font-size: 12px; line-height: 1.9;
    max-height: 160px; overflow-y: auto;
  }
  .podium { display: flex; gap: 8px; margin-bottom: 10px; }
  .podium .p {
    flex: 1; min-width: 0; background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 8px 6px; text-align: center; overflow: hidden;
  }
  .podium .medal { font-size: 16px; }
  .podium .nm {
    font-size: 12px; font-weight: 600; margin: 2px 0; word-break: break-all;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .podium .w { font-size: 14px; font-weight: 700; color: var(--good); }
  .rrow { margin: 8px 0; }
  .rrow .top { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 3px; }
  .rrow .nm { word-break: break-all; }
  .rrow .vv { color: var(--dim); }
  .foot { color: #5c6a7a; font-size: 11px; margin-top: 20px; line-height: 1.8; }
  .spin {
    display: inline-block; width: 12px; height: 12px; border: 2px solid var(--line);
    border-top-color: var(--acc); border-radius: 50%; animation: r 1s linear infinite; vertical-align: -2px;
  }
</style>
</head>
<body>
<div class="topbar">
  <h1>Smart 运行状态</h1>
  <button class="iconbtn" id="refresh" onclick="tick(true)">⟳</button>
</div>
<div class="chips">
  <span class="chip" id="chip-core">连接中…</span>
  <span class="chip" id="chip-mode"></span>
  <span class="chip" id="chip-mem"></span>
  <span class="chip" id="chip-sync"></span>
</div>
<div id="content"><div class="banner"><span class="spin"></span> 正在连接本地内核…</div></div>
<div class="foot">
  实时调度每 5 秒刷新:显示此刻各节点正在承载的连接与流量(同一分组多节点并行使用是 smart 的正常工作方式);切换分组瞬时完成。<br>
  累计排行由内核每 5 分钟统计一次,数据存在本机、按订阅隔离。
</div>
<script>
"use strict";
const BASE = "http://127.0.0.1:9090";
const RANK_CN = { MostUsed: "最常用", OccasionalUsed: "偶尔使用", RarelyUsed: "很少使用" };
const MSG_CN = {
  "No weight data available for the specified group": "内核还没为这个组积累出排行",
  "Not a Smart group": "该组不是 Smart 组",
  "Smart cache not available": "内核缓存不可用"
};
const RANK_SHOW = 8;
const LIVE_INTERVAL = 5000;
let groups = [], current = null, syncing = false;
let rankMaps = {};        // group -> 节点名:{Weight,Rank}(累计学习标签)
let lastTestMap = {};     // 节点名 -> 最近一次测速时间
let groupLastTest = null; // 当前分组最近测速时间
let liveData = {};        // group -> {rows:[[node,agg]...], nodeCount, connCount, total}
let lastConns = null;     // 原始连接缓存
let fastBusy = false, lastFetchAt = 0;

const $ = id => document.getElementById(id);
const esc = s => (s + "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const rankCN = s => RANK_CN[s] || (s || "");
const rankCls = s => s === "MostUsed" ? "most" : (s === "OccasionalUsed" ? "occ" : "rare");

function fmtAgo(ms) {
  if (ms < 0 || isNaN(ms)) return "—";
  const m = Math.floor(ms / 60000);
  if (m < 1) return "刚刚";
  if (m < 60) return m + " 分钟前";
  const h = Math.floor(m / 60);
  if (h < 24) return h + " 小时 " + (m % 60) + " 分前";
  return Math.floor(h / 24) + " 天前";
}

function fmtBytes(b) {
  if (!b || b <= 0) return "0B";
  const u = ["B", "KB", "MB", "GB", "TB"];
  let i = 0; let v = b;
  while (v >= 1024 && i < u.length - 1) { v /= 1024; i++; }
  return (i === 0 ? v : v.toFixed(1)) + u[i];
}

async function jget(p) {
  const r = await fetch(BASE + p, { cache: "no-store" });
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}
function banner(html) { $("content").innerHTML = '<div class="banner">' + html + "</div>"; }

async function loadMeta() {
  try {
    const v = await jget("/version");
    const mode = await jget("/configs").then(c => c.mode).catch(() => "?");
    const m = { rule: "规则分流", global: "全局", direct: "直连" };
    // /version 的 meta 是布尔值,不要对它调字符串方法
    $("chip-core").textContent = "内核 " + (v.version || "");
    $("chip-mode").textContent = "模式 " + (m[mode] || mode);
  } catch (e) { $("chip-core").textContent = "未连接"; }
}

async function loadGroups() {
  const d = await jget("/group");
  groups = (d.proxies || []).filter(g => (g.type || "").toLowerCase() === "smart");
  if (!groups.some(g => g.name === current)) current = groups.length ? groups[0].name : null;
}

function renderTabs() {
  const el = $("tabs");
  if (!el) return;
  el.innerHTML = groups.map((g, i) =>
    '<div class="tab' + (g.name === current ? " on" : "") + '" data-i="' + i + '">' + esc(g.name) + "</div>").join("");
}

/* 切换分组:有缓存数据就立即渲染(零等待),再后台刷新 */
function selectGroup(i) {
  current = groups[i].name;
  renderTabs();
  renderLive();
  slowTick();
}

document.addEventListener("click", e => {
  const t = e.target.closest(".tab");
  if (t) selectGroup(+t.dataset.i);
});

/* 一次 /connections 聚合出所有 smart 分组的实时数据 */
function aggregateAll(conns) {
  const data = {};
  for (const g of groups) data[g.name] = { map: new Map(), connCount: conns.length };
  for (const c of conns) {
    const ch = c.chains || [];
    for (let gi = ch.length - 1; gi > 0; gi--) {
      const grp = data[ch[gi]];
      if (!grp) continue;
      const node = ch[gi - 1];
      if (!node || node === ch[gi]) break;
      let e = grp.map.get(node);
      if (!e) { e = { n: 0, up: 0, down: 0, hosts: [] }; grp.map.set(node, e); }
      e.n++; e.up += c.upload || 0; e.down += c.download || 0;
      const md = c.metadata || {};
      const h = md.host || md.sniffHost || md.destinationIP || "";
      if (h && e.hosts.indexOf(h) < 0 && e.hosts.length < 3) e.hosts.push(h);
    }
  }
  for (const name in data) {
    const d = data[name];
    d.rows = [...d.map.entries()].sort((a, b) => (b[1].up + b[1].down) - (a[1].up + a[1].down));
    d.total = d.rows.reduce((s, e) => s + e[1].up + e[1].down, 0);
  }
  return data;
}

async function fastTick() {
  if (fastBusy) return;
  const now = Date.now();
  if (now - lastFetchAt < 1200) { renderLive(); return; }
  fastBusy = true;
  try {
    const d = await jget("/connections");
    lastConns = d.connections || [];
    $("chip-mem").textContent = d.memory ? "内存 " + fmtBytes(d.memory) : "";
    lastFetchAt = Date.now();
    liveData = aggregateAll(lastConns);
    renderLive();
  } catch (e) {
    const live = $("live");
    if (live) live.innerHTML = '<div class="banner"><b>无法连接本地内核 (127.0.0.1:9090)。</b><br>原因: ' + esc(e.message)
      + "<br>请先在主界面启动 VPN;内核运行后本页会自动恢复。</div>";
  }
  fastBusy = false;
}

/* 渲染当前分组:纯用缓存,瞬时完成 */
function renderLive() {
  const hero = $("hero"), live = $("live");
  if (!live || !hero || !current) return;
  const d = liveData[current];
  if (!d) {
    hero.innerHTML = "";
    live.innerHTML = '<div class="banner"><span class="spin"></span> 正在获取该分组实时数据…</div>';
    return;
  }
  const testAgo = groupLastTest ? fmtAgo(Date.now() - groupLastTest) : "尚未测速";
  hero.innerHTML = '<div class="card"><div class="stat-row">'
    + '<div class="stat"><div class="n">' + d.map.size + '</div><div class="t">活跃节点</div></div>'
    + '<div class="stat"><div class="n">' + d.connCount + '</div><div class="t">全部连接</div></div>'
    + '<div class="stat"><div class="n">' + fmtBytes(d.total) + '</div><div class="t">组内累计流量</div></div>'
    + '<div class="stat"><div class="n" style="font-size:13px;line-height:1.4">' + esc(testAgo) + '</div><div class="t">距上次测速</div></div>'
    + "</div></div>";

  if (!d.rows.length) {
    live.innerHTML = '<div class="banner">该分组此刻没有活跃连接——打开几个网站,这里就会实时显示各节点正在承载的流量与目标站点。</div>';
    return;
  }
  const max = Math.max(1, d.rows[0][1].up + d.rows[0][1].down);
  const rk = rankMaps[current] || {};
  const ago = groupLastTest ? fmtAgo(Date.now() - groupLastTest) : null;
  let s = '<div class="seclabel"><span class="l"><span class="live-dot"></span>实时调度</span>'
    + '<span class="r">'
    + (ago ? "距上次测速 " + ago + " · " : "尚未测速 · ")
    + d.rows.length + ' 个节点在承载</span></div><div class="card">';
  d.rows.forEach(([name, e], i) => {
    const t = e.up + e.down;
    const r = rk[name];
    s += '<div class="lrow"><div class="top"><span class="name"><span class="idx">' + (i + 1) + '.</span>'
      + "<span>" + esc(name) + "</span>"
      + (r ? '<span class="rank ' + rankCls(r.Rank) + '">' + esc(rankCN(r.Rank)) + "</span>" : "")
      + '</span><span class="val"><b>' + e.n + "</b> 条 · " + fmtBytes(t) + "</span></div>"
      + (e.hosts.length ? '<div class="sub">' + e.hosts.map(esc).join(" · ") + "</div>" : "")
      + '<div class="bar-wrap"><div class="bar" style="width:' + Math.max(2, Math.round(t / max * 100)) + '%"></div></div></div>';
  });
  live.innerHTML = s + "</div>";
}

async function slowTick() {
  try {
    const rankEl = $("rank");
    if (!rankEl || !current) return;
    const d = await jget("/group/" + encodeURIComponent(current) + "/weights");
    const ranked = (d.weights || d.result || []);
    const rm = {};
    for (const it of ranked) rm[it.Name] = it;
    rankMaps[current] = rm;
    const g = await jget("/group/" + encodeURIComponent(current));
    const allNodes = g.all || [];
    const upd = d.last_updated ? new Date(d.last_updated * 1000) : null;

    // 距上次测速:各节点延迟历史里最新的一次时间戳
    // (放在空排行早退之前,保证任何状态下都更新)
    try {
      const px = await jget("/proxies");
      lastTestMap = {};
      for (const name of allNodes) {
        const item = px.proxies && px.proxies[name];
        const h = item && item.history && item.history[item.history.length - 1];
        if (h && h.time) {
          const t = new Date(h.time).getTime();
          if (!isNaN(t)) lastTestMap[name] = t;
        }
      }
      const times = Object.values(lastTestMap);
      groupLastTest = times.length ? Math.max(...times) : null;
    } catch (e2) { groupLastTest = null; }

    if (!ranked.length) {
      rankEl.innerHTML = '<details class="ranking"><summary>累计权重排行(每 5 分钟统计)</summary><div class="rank-body">'
        + '<div class="banner" style="margin:0">'
        + esc(d.message ? (MSG_CN[d.message] || "内核提示:" + d.message) : "暂无权重数据")
        + "<br>正常上网几分钟后,内核会自动为使用过的节点计分。</div></div></details>";
      return;
    }
    const top = ranked.slice(0, Math.min(3, ranked.length));
    const medals = ["🥇", "🥈", "🥉"];
    let body = '<div class="podium">' + top.map((it, i) => {
      const w = Math.max(0, Math.min(100, it.Weight || 0));
      return '<div class="p"><div class="medal">' + medals[i] + "</div>"
        + '<div class="nm">' + esc(it.Name) + "</div>"
        + '<div class="w">' + Math.round(w) + "</div></div>";
    }).join("") + "</div>";
    const rest = ranked.slice(3, 3 + RANK_SHOW);
    body += rest.map((it, i) => {
      const w = Math.max(0, Math.min(100, it.Weight || 0));
      return '<div class="rrow"><div class="top"><span class="nm"><span style="color:var(--dim)">' + (i + 4)
        + '.</span> ' + esc(it.Name) + "</span>"
        + '<span class="vv"><span class="rank ' + rankCls(it.Rank) + '">' + esc(rankCN(it.Rank)) + "</span>"
        + Math.round(w) + "</span></div>"
        + '<div class="bar-wrap" style="height:4px"><div class="bar" style="width:' + Math.max(2, w) + '%"></div></div></div>';
    }).join("");
    const rankedNames = new Set(ranked.map(i => i.Name));
    const unused = allNodes.filter(n => !rankedNames.has(n));
    if (unused.length)
      body += '<details class="unused" style="margin-top:8px"><summary>未进入排行的节点(' + unused.length + "个)</summary>"
        + '<div class="unused-list">' + unused.map(esc).join("<br>") + "</div></details>";
    rankEl.innerHTML = '<details class="ranking"><summary>累计权重排行(每 5 分钟统计 · 更新 '
      + (upd ? upd.getHours().toString().padStart(2, "0") + ":" + upd.getMinutes().toString().padStart(2, "0") : "—")
      + ')</summary><div class="rank-body">' + body + "</div></details>";
  } catch (e) {
    const r = $("rank");
    if (r) r.innerHTML = "";
  }
}

async function tick(manual) {
  if (syncing) return;
  syncing = true;
  const btn = $("refresh");
  if (btn) btn.classList.add("spin");
  try {
    await loadGroups();
    if (!$("tabs")) {
      $("content").innerHTML = '<nav class="tabs" id="tabs"></nav><div id="hero"></div><div id="live"></div><div id="rank"></div>';
    }
    renderTabs();
    await fastTick();
    await slowTick();
    $("chip-sync").textContent = "已同步 " + new Date().toLocaleTimeString("zh-CN", { hour12: false });
  } catch (e) {
    banner("<b>无法连接本地内核 (127.0.0.1:9090)。</b><br>原因: " + esc(e.message)
      + "<br>请先在主界面启动 VPN;内核运行后本页会自动恢复。");
  }
  syncing = false;
  if (btn) setTimeout(() => btn.classList.remove("spin"), 600);
}

loadMeta();
tick();
setInterval(fastTick, LIVE_INTERVAL);
setInterval(slowTick, 15000);
setInterval(loadMeta, 30000);
</script>
</body>
</html>
