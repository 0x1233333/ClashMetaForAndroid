name: Sync Upstream & Build Smart

# 每日自动:合并上游 main → 内核子模块跟进 vernesong Alpha → go mod tidy → 触发 Build Release
# 注意:fork 的定时工作流需要在 Actions 页手动启用一次;60 天无活动会被 GitHub 自动暂停

on:
  schedule:
    - cron: "23 21 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: smart
          fetch-depth: 0
          submodules: recursive

      - name: Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge upstream main
        id: merge
        run: |
          git remote add upstream https://github.com/MetaCubeX/ClashMetaForAndroid.git
          git fetch upstream main
          # -X ours: 冲突行(如版本号)保留本分支,其余上游改动正常吸收
          if git merge upstream/main --no-edit -X ours; then
            echo "merged=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only --diff-filter=U | grep -vqx 'core/src/foss/golang/clash'; then
            git merge --abort
            echo "::error::存在无法自动解决的冲突,需要手动处理"
            exit 1
          else
            # 子模块 gitlink 冲突:上游推他们的内核指针,我们永远保留 smart 内核
            OUR=$(git ls-files -u core/src/foss/golang/clash | awk '$3=="2"{print $2; exit}')
            git update-index --cacheinfo 160000,"$OUR",core/src/foss/golang/clash
            git add core/src/foss/golang/clash
            git commit --no-edit
            echo "merged=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update smart kernel submodule to vernesong Alpha HEAD
        id: kernel
        run: |
          cd core/src/foss/golang/clash
          git fetch origin Alpha
          NEW=$(git rev-parse origin/Alpha)
          git checkout -q "$NEW"
          echo "kernel=$NEW" >> "$GITHUB_OUTPUT"
          cd -
          git add core/src/foss/golang/clash
          if git diff --cached --quiet; then
            echo "kernel_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "kernel_changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync Go modules
        if: steps.merge.outputs.merged == 'true' || steps.kernel.outputs.kernel_changed == 'true'
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-download-base-url: 'https://github.com/MetaCubeX/go/releases/download/build'
          go-version: '1.26'

      - name: Apply Go patches
        if: steps.merge.outputs.merged == 'true' || steps.kernel.outputs.kernel_changed == 'true'
        run: |
          cd "$(go env GOROOT)"
          for p in "$GITHUB_WORKSPACE"/.github/patch/*.patch; do patch --verbose -p 1 < "$p"; done

      - name: Re-checkout pinned kernel then go mod tidy
        if: steps.merge.outputs.merged == 'true' || steps.kernel.outputs.kernel_changed == 'true'
        run: |
          git submodule update --init --recursive --force
          cd core/src/foss/golang && go mod tidy
          cd ../../main/golang && go mod tidy

      - name: Commit & push
        id: push
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "nothing to sync"
          else
            git commit -m "sync: upstream main + vernesong Alpha @$(cd core/src/foss/golang/clash && git rev-parse --short HEAD)"
            git push origin smart
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Pick next unused release tag
        if: steps.push.outputs.changed == 'true'
        id: tag
        run: |
          BASE=$(grep -oE 'versionName = "[0-9.]+"' build.gradle.kts | head -1 | grep -oE '[0-9.]+')
          IFS='.' read -r MA MI PA <<< "$BASE"
          for i in $(seq 0 40); do
            CAND="v${MA}.${MI}.$((PA + i))"
            if ! git ls-remote --exit-code --tags origin "refs/tags/$CAND" >/dev/null 2>&1; then
              echo "tag=$CAND" >> "$GITHUB_OUTPUT"
              echo "picked $CAND"
              exit 0
            fi
          done
          echo "::error::找不到空闲 tag"
          exit 1

      - name: Trigger Build Release
        if: steps.push.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run build-release.yaml --ref smart -f release-tag="${{ steps.tag.outputs.tag }}"
          echo "dispatched build for ${{ steps.tag.outputs.tag }}"
