name: Build Release

on:
  workflow_dispatch:
    inputs:
      release-tag:
        description: 'Release Tag (v2.x.x)'
        required: true

concurrency:
  group: build-release-${{ inputs.release-tag }}
  cancel-in-progress: false

jobs:
  BuildRelease:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      
      - name: Checkout submodules
        run: git submodule update --init --recursive --force

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-download-base-url: 'https://github.com/MetaCubeX/go/releases/download/build'
          go-version: '1.26'

      - name: Apply Patches
        run: |
          cd $(go env GOROOT)
          for p in $GITHUB_WORKSPACE/.github/patch/*.patch; do patch --verbose -p 1 < "$p"; done

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
      
      - name: Convert and set version env
        id: process-version
        run: |
          VERSION_TAG=${{ inputs.release-tag }}
          VERSION_TAG=${VERSION_TAG#v}                              # remove the 'v' prefix
          IFS='.' read -ra VERSION_PARTS <<< "$VERSION_TAG"         # split into array
          VERSION_CODE=$(printf "%1d%02d%03d" "${VERSION_PARTS[0]}" "${VERSION_PARTS[1]}" "${VERSION_PARTS[2]}")
          
          echo "versonName=$VERSION_TAG" >> $GITHUB_OUTPUT          # "1.2.3"
          echo "versonCode=$VERSION_CODE" >> $GITHUB_OUTPUT         # "102003"
      
      # Re-write version in build.gradle.kts
      - name: Re-write version
        uses: Devofure/advance-android-version-actions@v1.5
        with:
          gradlePath: build.gradle.kts
          versionCode: ${{ steps.process-version.outputs.versonCode }}
          versionName: ${{ steps.process-version.outputs.versonName }}
      
      # If any change found, commit it and push
      - name: Commit and push if changes
        run: |
          changes=$(git diff --name-only origin/main | wc -l)
          if [ $changes -gt 0 ]
          then
            newVersionName=${{ steps.process-version.outputs.versonName }}
            newVersionCode=${{ steps.process-version.outputs.versonCode }}
            git config --global user.name 'GitHub Action'
            git config --global user.email 'action@github.com'
            git add build.gradle.kts
            git commit -am "Bump version to $newVersionName ($newVersionCode)"
            git tag "v$newVersionName"
            git push --follow-tags
          fi

      - name: Update CA
        run: |
          sudo apt-get update && sudo apt-get install ca-certificates
          sudo update-ca-certificates
          cp -f /etc/ssl/certs/ca-certificates.crt core/src/foss/golang/clash/component/ca/ca-certificates.crt

      - name: Restore signing keystore
        env:
          SMART_KEYSTORE_BASE64: ${{ secrets.SMART_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SMART_KEYSTORE_BASE64" ]; then
            echo "::error::SMART_KEYSTORE_BASE64 is not set — refusing to build an unsigned release"
            exit 1
          fi
          echo "$SMART_KEYSTORE_BASE64" | base64 -d > release.keystore
          echo "release.keystore restored: $(wc -c < release.keystore) bytes"

      - name: Signing properties
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ -z "$SIGNING_STORE_PASSWORD" ] || [ -z "$SIGNING_KEY_ALIAS" ] || [ -z "$SIGNING_KEY_PASSWORD" ]; then
            echo "::error::signing secrets missing — refusing to build an unsigned release"
            exit 1
          fi
          touch signing.properties
          echo keystore.password="$SIGNING_STORE_PASSWORD" > signing.properties
          echo key.alias="$SIGNING_KEY_ALIAS" >> signing.properties
          echo key.password="$SIGNING_KEY_PASSWORD" >> signing.properties
          # 不要把口令回显进构建日志:只报行数
          echo "signing.properties written: $(wc -l < signing.properties) lines (values redacted)"

      - name: Release Build
        if: success()
        run: ./gradlew --no-daemon app:assembleMetaRelease

      - name: Verify release APK
        run: |
          set -e
          APK=$(ls app/build/outputs/apk/meta/release/*.apk | head -1)
          echo "verifying $APK"
          # 1) 必须已签名(未签名包直接失败,不再上传)
          APKSIGNER=$(ls "$ANDROID_SDK_ROOT"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" | tee apksigner.txt
          # 2) versionName 必须与 release tag 一致
          EXPECTED="${{ inputs.release-tag }}"
          EXPECTED="${EXPECTED#v}"
          ACTUAL=$(grep -oE 'versionName[[:space:]]*=[[:space:]]*"[^"]+"' build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::versionName $ACTUAL != tag $EXPECTED"
            exit 1
          fi
          # 3) 哈希清单,随包一起发布便于校验
          cd app/build/outputs/apk/meta/release
          sha256sum ./*.apk > sha256sums.txt
          cat sha256sums.txt

      - name: Tag Repo
        uses: richardsimko/update-tag@v3
        with:
          tag_name: ${{ inputs.release-tag }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Release
        uses: softprops/action-gh-release@v3
        if: ${{ success() }}
        with:
          tag_name: ${{ inputs.release-tag }}
          # 只上传签名好的 apk + 哈希清单(以前用 * 会把 output-metadata.json 之类一起塞进去)
          files: |
            app/build/outputs/apk/meta/release/*.apk
            app/build/outputs/apk/meta/release/sha256sums.txt
          generate_release_notes: true

      - name: Release Changelog Builder
        uses: mikepenz/release-changelog-builder-action@v6
        with:
          configurationJson: |
            {
              "ignore_labels": [
                "Update"
              ],
            }